# H2 in MySQL mode, so tests need no Docker
spring.datasource.url=jdbc:h2:mem:rostersync;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# tests drive the relay by hand so results are deterministic
rostersync.jwt-secret=test-secret-test-secret-test-secret-0123456789
rostersync.relay-enabled=false
rostersync.demo-data=false
rostersync.failure-injection=true
