# ---------- server ----------
server.port=8080
# never send exception messages or stack traces to clients
server.error.include-message=never
server.error.include-stacktrace=never

# ---------- database (MySQL; Flyway owns the schema) ----------
spring.application.name=roster-sync
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rostersync}?rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Anupammysql}
spring.datasource.hikari.maximum-pool-size=20
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP


spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
spring.jackson.default-property-inclusion=non_null

# ---------- roster sync ----------
# HS256 signing key for login tokens: at least 32 bytes, set JWT_SECRET in every real environment
rostersync.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
rostersync.token-ttl=1h
# safety brake trips when >= 30% of active employees are missing from the nightly file
rostersync.brake-threshold=${BRAKE_THRESHOLD:0.30}
# fixed at deploy time (stored on each employee row)
rostersync.diff-buckets=64
rostersync.relay-enabled=true
rostersync.relay-poll-ms=500
rostersync.employee-cache-ttl=30s
rostersync.office-cache-ttl=5m
rostersync.demo-data=${DEMO_DATA:false}
rostersync.failure-injection=${FAILURE_INJECTION:false}

# ---------- monitoring and logs ----------
management.endpoints.web.exposure.include=health,metrics,prometheus
# JSON logs
spring.main.banner-mode=console
logging.structured.format.console=ecs
